name: Package installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    uses: eliezer-dev-software-enginner/megalodonte-packaging/.github/workflows/package-javafx.yml@main
    with:
      project-directory: .
      artifact-name: gobitech
      dependencies: 'pack-utilities jsonc-ui'
      release: true
      smoke-test: true

    secrets:
      GOBITECH_ADMIN_LOGIN: ${{ secrets.GOBITECH_ADMIN_LOGIN }}
      GOBITECH_ADMIN_PASSWORD: ${{ secrets.GOBITECH_ADMIN_PASSWORD }}
